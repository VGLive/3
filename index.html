<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vikash Gupta</title>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/qMWhMjrg/image.jpg">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet"/>

    <style>
    body {
        font-family: 'Inter', 'Segoe UI', Helvetica, sans-serif;
        background-color: #f3f4f6;
        margin: 0;
        padding: 0;
        color: #1f2937;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh; 
    }

    .card {
        background: #ffffff;
        width: 90%;
        max-width: 450px;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        border: 1px solid #e5e7eb;
        margin: 20px auto;
    }

    h1.profile-name {
        margin: 0 0 20px 0;
        font-size: 2.2em;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #4f46e5;
        font-weight: 800;
        line-height: 1.2;
    }

    .profile-pic {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #eef2ff;
        box-shadow: 0 4px 15px rgba(79, 70, 229, 0.15);
        margin-bottom: 25px;
        display: block;
        margin-left: auto;
        margin-right: auto;
    }

    .info-row {
        margin-bottom: 12px;
        font-size: 1.1em;
        color: #4b5563;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }
    
    .info-row i {
        color: #4f46e5; 
        width: 20px;
    }

    .section-header {
        text-transform: uppercase;
        font-size: 0.85em;
        color: #6b7280;
        letter-spacing: 1.5px;
        margin: 25px 0 12px 0;
        font-weight: 700;
    }

    .links-container {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .btn {
        display: block;
        padding: 14px;
        text-decoration: none;
        color: white;
        border-radius: 10px;
        font-weight: 700;
        transition: transform 0.2s, box-shadow 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }
    
    .btn:hover {
        transform: translateY(-2px);
        opacity: 0.95;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .btn-tools {
        background: #4f46e5; 
        border: 1px solid #4338ca;
    }

    .btn-tv {
        background: #dc2626;
        border: 1px solid #b91c1c;
    }

    .instagram { background: #E1306C; }
    .facebook { background: #1877f2; }
    .twitter-x { background: #000000; } 
    </style>
</head>

<body>
    <div class="card">
        <h1 class="profile-name">VIKASH GUPTA</h1>

        <img src="https://i.ibb.co/qMWhMjrg/image.jpg" alt="Vikash Gupta" class="profile-pic" />

        <div class="info-row">
            <i class="fas fa-map-marker-alt"></i>
            <span>Mumbai, India</span>
        </div>

        <div class="info-row">
            <i class="fas fa-envelope"></i>
            <span>peoplesvikashgupta@gmail.com</span>
        </div>

        <hr style="border:0; border-top:1px solid #e5e7eb; margin: 25px 0 15px 0;" />

        <div class="section-header">My Websites</div>
        <div class="links-container">
            <a href="http://www.vglivetools.blogspot.com" target="_blank" class="btn btn-tools">
                <i class="fas fa-layer-group"></i> VG Live Tools
            </a>
            
            <a href="https://vglivetv.pages.dev/" target="_blank" class="btn btn-tv">
                <i class="fa-solid fa-tv"></i> VG Live TV
            </a>
        </div>

        <div class="section-header">Social Media</div>
        <div class="links-container">
            <a href="https://www.instagram.com/peoplesvikashgupta" target="_blank" class="btn instagram">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            
            <a href="https://www.facebook.com/peoplesvikashgupta" target="_blank" class="btn facebook">
                <i class="fab fa-facebook"></i> Facebook
            </a>

            <a href="https://www.x.com/peoplesvikash" target="_blank" class="btn twitter-x">
                <i class="fa-brands fa-x-twitter"></i> X
            </a>
        </div>
    </div>
</body>
</html>
